name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify project structure
        run: |
          ls -la
          test -f README.md
          test -f server/frontend/static/About.html
          test -f server/frontend/static/Contact.html
          test -f server/frontend/src/components/Register/Register.jsx
          echo "All required files verified successfully."
